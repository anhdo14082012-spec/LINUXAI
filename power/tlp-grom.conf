# tlp-grom.conf — cấu hình TLP cho GROM LINUX
# Copy vào /etc/tlp.d/90-grom.conf để áp dụng cùng grom-power-daemon.sh
#
# TLP lo phần cứng (USB autosuspend, SATA, PCIe, Wi-Fi power save...),
# grom-power-daemon.sh lo phần CPU governor theo lựa chọn người dùng.
# Hai cái không trùng nhau, bổ sung cho nhau.

# CPU: để TLP không ghi đè governor của grom-power-daemon
CPU_SCALING_GOVERNOR_ON_AC=schedutil
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Tiết kiệm điện USB khi không dùng
USB_AUTOSUSPEND=1

# Wi-Fi power save khi dùng pin
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Tắt bớt PCIe ASPM để tiết kiệm điện khi dùng pin
PCIE_ASPM_ON_BAT=powersupersave

# Ổ đĩa: APM thấp khi dùng pin (đĩa nghỉ sớm hơn)
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"

# Âm thanh: tắt power save để tránh rè (bật lại nếu phần cứng hỗ trợ tốt)
SOUND_POWER_SAVE_ON_BAT=1
